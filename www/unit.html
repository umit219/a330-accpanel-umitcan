<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unit Converter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="theme.css">

    <style>

        /* =========================
           UNIT CONVERTER
        ========================= */

        .unit-card {
            padding: 16px;
        }

        .section-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }


        /* =========================
           SELECT
        ========================= */

        .unit-select {
            width: 100%;
            height: 44px;

            padding: 0 12px;

            background: var(--bg);
            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 10px;

            font-family: 'Inter', sans-serif;
            font-size: 13px;

            outline: none;
            cursor: pointer;

            transition:
                border-color 0.2s,
                background 0.25s,
                color 0.25s;
        }

        .unit-select:focus {
            border-color: var(--accent);
        }


        /* =========================
           CONVERTER LAYOUT
        ========================= */

        .converter-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                42px
                minmax(0, 1fr);

            align-items: end;

            gap: 10px;
        }


        .converter-column {
            min-width: 0;
        }


        /* =========================
           VALUE
        ========================= */

        .value-input,
        .result-output {

            width: 100%;
            height: 44px;

            margin-top: 8px;

            border-radius: 10px;
            border: 1px solid var(--border);

            font-family: 'Inter', sans-serif;
            font-size: 13px;

            transition:
                border-color 0.2s,
                background 0.25s,
                color 0.25s;
        }


        .value-input {

            padding: 0 12px;

            background: var(--bg);
            color: var(--text);

            outline: none;
        }


        .value-input::placeholder {
            color: var(--text-muted);
        }


        .value-input:focus {
            border-color: var(--accent);
        }


        .result-output {

            display: flex;
            align-items: center;

            padding: 0 12px;

            background: var(--bg);
            color: var(--text);

            overflow: hidden;
            white-space: nowrap;

            font-weight: 500;
        }


        /* =========================
           SWAP
        ========================= */

        .swap-column {

            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .swap-btn {

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--bg);
            color: var(--text);

            font-family: Arial, sans-serif;
            font-size: 18px;

            cursor: pointer;

            transition:
                border-color 0.2s,
                color 0.2s,
                background 0.2s;
        }


        .swap-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }


        .swap-btn:active {
            transform: scale(0.96);
        }


        /* =========================
           CLEAR
        ========================= */

        .clear-btn {

            width: 100%;
            height: 42px;

            margin-top: 14px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--bg);
            color: var(--text);

            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                border-color 0.2s,
                color 0.2s,
                background 0.2s;
        }


        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }


        .clear-btn:active {
            transform: scale(0.99);
        }


        /* =========================
           HEADER
        ========================= */

        .unit-page-header {

            position: relative;

            display: grid;

            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            margin-bottom: 24px;
            padding-top: 4px;
        }


        .unit-page-header .back-link {
            justify-self: start;
        }


        .unit-page-header .page-title {

            justify-self: center;

            font-size: 15px;
            font-weight: 600;

            color: var(--text);

            letter-spacing: 0.2px;

            white-space: nowrap;
        }


        .unit-page-header .theme-btn {
            justify-self: end;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 380px) {

            .converter-grid {

                grid-template-columns:
                    minmax(0, 1fr)
                    36px
                    minmax(0, 1fr);

                gap: 7px;
            }


            .unit-select,
            .value-input,
            .result-output {
                font-size: 12px;
            }


            .swap-btn {

                width: 34px;
                height: 34px;

                font-size: 16px;
            }


            .unit-page-header .page-title {
                font-size: 14px;
            }

        }

    </style>
</head>


<body>

<div class="page-wrap">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="unit-page-header">

        <a href="index.html" class="back-link">
            ← Ana Menü
        </a>


        <span class="page-title">
            Unit Converter
        </span>


        <button
            class="theme-btn"
            id="themeBtn"
            type="button"
            onclick="toggleTheme()"
            aria-label="Tema değiştir"
        >
            🌙
        </button>

    </header>



    <!-- =========================
         CATEGORY
    ========================== -->

    <div class="card unit-card">

        <label
            class="section-label"
            for="categorySelect"
        >
            Category
        </label>


        <select
            id="categorySelect"
            class="unit-select"
        ></select>

    </div>



    <!-- =========================
         CONVERTER
    ========================== -->

    <div class="card unit-card">

        <div class="converter-grid">


            <!-- FROM -->

            <div class="converter-column">

                <label
                    class="section-label"
                    for="fromUnit"
                >
                    From
                </label>


                <select
                    id="fromUnit"
                    class="unit-select"
                ></select>


                <input
                    id="fromValue"
                    class="value-input"
                    type="number"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="0"
                >

            </div>



            <!-- SWAP -->

            <div class="swap-column">

                <button
                    id="swapBtn"
                    class="swap-btn"
                    type="button"
                    aria-label="Birimleri değiştir"
                >
                    ⇄
                </button>

            </div>



            <!-- TO -->

            <div class="converter-column">

                <label
                    class="section-label"
                    for="toUnit"
                >
                    To
                </label>


                <select
                    id="toUnit"
                    class="unit-select"
                ></select>


                <div
                    id="result"
                    class="result-output"
                >
                    0
                </div>

            </div>

        </div>



        <!-- CLEAR -->

        <button
            id="clearBtn"
            class="clear-btn"
            type="button"
        >
            CLEAR
        </button>

    </div>

</div>


<!-- =========================
     SCRIPTS
========================== -->

<script src="theme.js"></script>
<script src="unit.js"></script>

</body>

</html>
