<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document Scanner</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#0f1117">

    <link rel="apple-touch-icon"
          href="images/icon.png">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Document Scanner">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
          href="theme.css">

    <style>

        /* =====================================================
           SCANNER
        ===================================================== */

        .scanner-page {
            max-width: 480px;
            margin: 0 auto;
        }

        .scanner-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .scanner-action {
            min-height: 96px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 14px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            transition: .15s;
        }

        .scanner-action:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .scanner-action .icon {
            font-size: 28px;
        }

        .scanner-action .label {
            font-size: 12px;
            font-weight: 600;
        }

        .scanner-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 20px 0 10px;
            letter-spacing: .5px;
        }

        .document-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .document-thumb {
            width: 58px;
            height: 72px;
            border-radius: 7px;
            background: var(--bg);
            border: 1px solid var(--border);
            object-fit: cover;
            flex-shrink: 0;
        }

        .document-info {
            min-width: 0;
            flex: 1;
        }

        .document-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .document-buttons {
            display: flex;
            gap: 6px;
        }

        .small-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
        }

        .small-btn:hover {
            border-color: var(--accent);
        }

        .small-btn.delete:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 35px 20px;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* =====================================================
           EDITOR
        ===================================================== */

        .scanner-modal {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .scanner-modal.show {
            display: flex;
        }

        .scanner-modal-header {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .scanner-modal-title {
            font-size: 14px;
            font-weight: 700;
        }

        .scanner-close {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 17px;
        }

        .editor-area {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            overflow: hidden;
        }

        .editor-image-wrap {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #editorImage {
            max-width: 100%;
            max-height: 68vh;
            display: block;
            border-radius: 8px;
            user-select: none;
            -webkit-user-select: none;
        }

        #cropBox {
            position: absolute;
            border: 2px solid #fff;
            box-shadow:
                0 0 0 9999px rgba(0,0,0,.52);
            display: none;
            touch-action: none;
        }

        .crop-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            background: rgba(0,0,0,.35);
        }

        .crop-handle.tl {
            left: -9px;
            top: -9px;
        }

        .crop-handle.tr {
            right: -9px;
            top: -9px;
        }

        .crop-handle.bl {
            left: -9px;
            bottom: -9px;
        }

        .crop-handle.br {
            right: -9px;
            bottom: -9px;
        }

        .editor-toolbar {
            padding: 10px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 7px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .editor-tool {
            min-width: 72px;
            height: 42px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .editor-tool.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .editor-tool.save {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* =====================================================
           DOCUMENT VIEWER
        ===================================================== */

        .viewer-modal {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2100;
            display: none;
            flex-direction: column;
        }

        .viewer-modal.show {
            display: flex;
        }

        .viewer-pages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .viewer-page {
            background: #fff;
            margin: 0 auto 18px;
            max-width: 600px;
            box-shadow: 0 3px 20px rgba(0,0,0,.35);
        }

        .viewer-page img {
            width: 100%;
            display: block;
        }

        .viewer-toolbar {
            padding: 10px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            gap: 8px;
        }

        .viewer-toolbar button {
            flex: 1;
            height: 44px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .viewer-toolbar .primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* =====================================================
           DOCUMENT NAME MODAL
        ===================================================== */

        .name-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .name-modal.show {
            display: flex;
        }

        .name-sheet {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }

        .name-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .name-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .name-input {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 16px !important;
            outline: none;
            margin-bottom: 12px;
        }

        .name-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .name-buttons button {
            height: 42px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        .name-buttons .primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* =====================================================
           PRINT
        ===================================================== */

        @media print {

            body {
                background: #fff !important;
                padding: 0 !important;
            }

            body > * {
                display: none !important;
            }

            #printArea {
                display: block !important;
            }

            #printArea img {
                width: 100%;
                max-width: 100%;
                page-break-after: always;
                display: block;
            }

            #printArea img:last-child {
                page-break-after: auto;
            }
        }

        #printArea {
            display: none;
        }

    </style>
</head>

<body>

<div class="scanner-page">

    <div class="page-header">

        <a href="index.html"
           class="back-link">
            ← Geri
        </a>

        <div class="page-title">
            📷 Document Scanner
        </div>

        <button
            class="theme-btn"
            id="themeBtn"
            onclick="toggleTheme()">
            🌙
        </button>

    </div>


    <!-- ACTIONS -->

    <div class="scanner-actions">

        <button
            class="scanner-action"
            id="cameraBtn">

            <span class="icon">📷</span>
            <span class="label">KAMERA</span>

        </button>


        <button
            class="scanner-action"
            id="galleryBtn">

            <span class="icon">🖼️</span>
            <span class="label">GALERİ</span>

        </button>

    </div>


    <!-- Hidden inputs -->

    <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
        style="display:none">


    <input
        type="file"
        id="galleryInput"
        accept="image/*"
        multiple
        style="display:none">


    <div class="scanner-section-title">
        DOCUMENTS
    </div>


    <div id="documentsList">

        <div class="empty-state">
            Henüz kayıtlı belge yok.
        </div>

    </div>

</div>


<!-- =========================================================
     IMAGE EDITOR
========================================================= -->

<div
    id="editorModal"
    class="scanner-modal">

    <div class="scanner-modal-header">

        <span
            class="scanner-modal-title"
            id="editorTitle">
            Edit Page
        </span>

        <button
            class="scanner-close"
            id="closeEditor">
            ✕
        </button>

    </div>


    <div class="editor-area">

        <div class="editor-image-wrap"
             id="editorImageWrap">

            <img
                id="editorImage"
                alt="Document">

            <div
                id="cropBox">

                <span class="crop-handle tl"></span>
                <span class="crop-handle tr"></span>
                <span class="crop-handle bl"></span>
                <span class="crop-handle br"></span>

            </div>

        </div>

    </div>


    <div class="editor-toolbar">

        <button
            class="editor-tool"
            id="cropTool">
            ✂️ CROP
        </button>

        <button
            class="editor-tool"
            id="rotateTool">
            🔄 ROTATE
        </button>

        <button
            class="editor-tool"
            id="grayTool">
            ◐ GRAYSCALE
        </button>

        <button
            class="editor-tool"
            id="resetTool">
            ↩ RESET
        </button>

        <button
            class="editor-tool save"
            id="savePage">
            ✓ SAVE
        </button>

    </div>

</div>


<!-- =========================================================
     DOCUMENT VIEWER
========================================================= -->

<div
    id="viewerModal"
    class="viewer-modal">

    <div class="scanner-modal-header">

        <span
            class="scanner-modal-title"
            id="viewerTitle">
            Document
        </span>

        <button
            class="scanner-close"
            id="closeViewer">
            ✕
        </button>

    </div>


    <div
        id="viewerPages"
        class="viewer-pages">
    </div>


    <div class="viewer-toolbar">

        <button
            id="addPageBtn">
            ＋ PAGE
        </button>

        <button
            id="printPdfBtn"
            class="primary">
            📄 PDF
        </button>

        <button
            id="deleteDocumentBtn">
            🗑 DELETE
        </button>

    </div>

</div>


<!-- =========================================================
     NAME MODAL
========================================================= -->

<div
    id="nameModal"
    class="name-modal">

    <div class="name-sheet">

        <div class="name-title">
            Save Document
        </div>

        <div class="name-sub">
            Belge için bir isim gir.
        </div>

        <input
            id="documentName"
            class="name-input"
            type="text"
            placeholder="Örn. AMM Notes"
            autocomplete="off">

        <div class="name-buttons">

            <button
                id="cancelName">
                CANCEL
            </button>

            <button
                id="saveDocumentName"
                class="primary">
                SAVE
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     PRINT AREA
========================================================= -->

<div id="printArea"></div>


<div
    class="offline-bar"
    id="offlineBar">
    📡 Çevrimdışı mod
</div>


<script src="theme.js"></script>
<script src="scanner.js"></script>


<script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('/sw.js');

}

</script>

</body>
</html>
