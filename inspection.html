<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Inspection Recorder</title>

<link rel="stylesheet" href="theme.css">

<style>
/* ================================
   INSPECTION RECORDER
================================ */

.inspection-header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom:24px;
    padding-top:4px;
}

.inspection-header .back-link{
    justify-self:start;
}

.inspection-title{
    justify-self:center;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
}

.inspection-header .theme-btn{
    justify-self:end;
}

/* BUTTONS */

.primary-btn{
    width:100%;
    height:44px;
    border:1px solid var(--accent);
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font:600 13px Inter,sans-serif;
    cursor:pointer;
}

.secondary-btn{
    height:42px;
    padding:0 16px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:var(--text);
    font:600 13px Inter,sans-serif;
    cursor:pointer;
}

.danger-btn{
    height:36px;
    padding:0 11px;
    border:1px solid var(--danger);
    border-radius:9px;
    background:transparent;
    color:var(--danger);
    font:600 11px Inter,sans-serif;
    cursor:pointer;
}

/* INSPECTION LIST */

.inspection-card{
    cursor:pointer;
}

.inspection-card-title{
    font-size:14px;
    font-weight:600;
    color:var(--text);
}

.inspection-card-sub{
    margin-top:6px;
    font-size:12px;
    color:var(--text-muted);
    line-height:1.6;
}

.inspection-card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--border);
    font-size:11px;
    color:var(--text-muted);
}

.finding-count{
    color:var(--accent);
    font-weight:600;
}

.empty-state{
    text-align:center;
    padding:30px 16px;
    color:var(--text-muted);
    font-size:12px;
    line-height:1.7;
}

/* MODALS */

.form-modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.55);
}

.form-modal.show{
    display:flex;
}

.form-sheet{
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px 18px 0 0;
    padding:20px;
}

.form-title{
    font-size:16px;
    font-weight:600;
    color:var(--text);
    margin-bottom:18px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    font-size:11px;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.05em;
}

.form-input,
.form-select,
.form-textarea{
    width:100%;
    box-sizing:border-box;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    font:13px Inter,sans-serif;
    outline:none;
}

.form-input,
.form-select{
    height:44px;
    padding:0 12px;
}

.form-textarea{
    min-height:120px;
    resize:vertical;
    padding:12px;
}

.form-group{
    margin-bottom:14px;
}

.form-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:18px;
}

/* PHOTO SELECT */

.photo-pick-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.photo-pick-btn{
    height:44px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    font:600 11px Inter,sans-serif;
    cursor:pointer;
}

.photo-selection-info{
    margin-top:8px;
    font-size:10px;
    color:var(--text-muted);
}

.pending-gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.pending-item{
    position:relative;
}

.pending-item img{
    display:block;
    width:100%;
    height:74px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--border);
}

.pending-remove{
    position:absolute;
    right:4px;
    top:4px;
    width:22px;
    height:22px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.72);
    color:#fff;
    cursor:pointer;
}

/* DETAIL */

.detail-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.detail-title{
    font-size:16px;
    font-weight:600;
    color:var(--text);
}

.detail-meta{
    margin-top:5px;
    font-size:12px;
    color:var(--text-muted);
    line-height:1.6;
}

.add-finding{
    margin-top:4px;
    margin-bottom:14px;
}

.detail-back{
    display:inline-flex;
    margin-bottom:14px;
    border:0;
    background:none;
    color:var(--text-muted);
    font:12px Inter,sans-serif;
    cursor:pointer;
}

/* FINDING */

.finding-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
    cursor:pointer;
}

.finding-main{
    padding:14px;
    position:relative;
}

.finding-number{
    font-size:10px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.06em;
    margin-bottom:8px;
}

.finding-location{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    margin-bottom:8px;
}

.finding-text{
    font-size:13px;
    color:var(--text);
    line-height:1.7;
    white-space:pre-wrap;
    padding-right:24px;
}

.finding-arrow{
    position:absolute;
    right:14px;
    bottom:14px;
    font-size:13px;
    color:var(--text-muted);
    transition:transform .2s;
}

.finding-card.expanded .finding-arrow{
    transform:rotate(180deg);
    color:var(--accent);
}

.finding-expand{
    display:none;
    padding:0 14px 14px;
}

.finding-card.expanded .finding-expand{
    display:block;
}

.finding-divider{
    height:1px;
    background:var(--border);
    margin-bottom:12px;
}

/* PHOTO GALLERY */

.photo-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:8px;
}

.gallery-photo-wrap{
    position:relative;
}

.gallery-photo{
    display:block;
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--bg);
    cursor:pointer;
}

.photo-number{
    position:absolute;
    left:6px;
    bottom:6px;
    padding:3px 6px;
    border-radius:5px;
    background:rgba(0,0,0,.7);
    color:#fff;
    font-size:9px;
    pointer-events:none;
}

.marked-badge{
    position:absolute;
    top:6px;
    right:6px;
    padding:3px 5px;
    border-radius:5px;
    background:var(--accent);
    color:#fff;
    font-size:8px;
    pointer-events:none;
}

.no-photo{
    padding:16px;
    border:1px dashed var(--border);
    border-radius:9px;
    text-align:center;
    color:var(--text-muted);
    font-size:11px;
}

.finding-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--border);
}

.finding-date{
    font-size:10px;
    color:var(--text-muted);
}

.delete-finding{
    border:0;
    background:none;
    color:var(--danger);
    font:600 11px Inter,sans-serif;
    cursor:pointer;
}

.add-photos-btn{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:8px;
    height:34px;
    padding:0 10px;
    font:600 10px Inter,sans-serif;
    cursor:pointer;
}

/* PHOTO VIEWER */

.photo-modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    flex-direction:column;
    background:rgba(0,0,0,.94);
}

.photo-modal.show{
    display:flex;
}

.photo-topbar{
    height:58px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    color:#fff;
}

.photo-counter{
    font-size:12px;
    font-weight:600;
}

.photo-close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:22px;
    cursor:pointer;
}

.photo-stage{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:8px 12px;
}

#photoPreview{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:6px;
}

.photo-nav{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.photo-nav button{
    pointer-events:auto;
    width:42px;
    height:42px;
    margin:10px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.photo-bottom{
    flex-shrink:0;
    padding:10px 12px 18px;
    display:flex;
    justify-content:center;
    gap:8px;
}

.photo-action{
    height:40px;
    padding:0 14px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:9px;
    background:rgba(255,255,255,.1);
    color:#fff;
    font:600 11px Inter,sans-serif;
    cursor:pointer;
}

/* ANNOTATION */

.annotation-modal{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    flex-direction:column;
    background:#000;
}

.annotation-modal.show{
    display:flex;
}

.annotation-header{
    height:54px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    color:#fff;
}

.annotation-title{
    font-size:13px;
    font-weight:600;
}

.annotation-close{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.annotation-stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#annotationCanvas{
    max-width:100%;
    max-height:100%;
    touch-action:none;
    cursor:crosshair;
}

.annotation-toolbar{
    flex-shrink:0;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    padding:8px;
    background:#111;
}

.tool-btn{
    min-width:54px;
    height:38px;
    padding:0 9px;
    border:1px solid #333;
    border-radius:8px;
    background:#1c1c1c;
    color:#fff;
    font:600 10px Inter,sans-serif;
    cursor:pointer;
}

.tool-btn.active,
.tool-save{
    background:#4f8ef7;
    border-color:#4f8ef7;
}

.tool-danger{
    color:#ff6b6b;
}

/* OFFLINE */

.offline-bar{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    z-index:100;
    padding:7px 12px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    font:10px Inter,sans-serif;
}

@media(max-width:380px){

    .inspection-title{
        font-size:14px;
    }

    .gallery-photo{
        height:100px;
    }

    .pending-gallery{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<div class="page-wrap">

<header class="inspection-header">

    <a href="index.html" class="back-link">
        ← Ana Menü
    </a>

    <span class="inspection-title">
        Inspection Recorder
    </span>

    <button
        class="theme-btn"
        id="themeBtn"
        type="button"
        onclick="toggleTheme()">
        🌙
    </button>

</header>

<main id="app"></main>

</div>


<!-- ================================
     NEW INSPECTION MODAL
================================ -->

<div id="inspectionModal" class="form-modal">

    <div class="form-sheet">

        <div class="form-title">
            New Inspection
        </div>

        <div class="form-group">

            <label class="form-label">
                Aircraft
            </label>

            <input
                id="aircraftInput"
                class="form-input"
                type="text"
                placeholder="Örn. TC-JNB"
                autocomplete="off">

        </div>


        <div class="form-group">

            <label class="form-label">
                Inspection Type
            </label>

            <select
                id="inspectionType"
                class="form-select">

                <option>Landing Gear Inspection</option>
                <option>SAFA Inspection</option>
                <option>Cargo Inspection</option>
                <option>Cabin Inspection</option>
                <option>Exterior Inspection</option>
                <option>General Inspection</option>
                <option>Other</option>

            </select>

        </div>


        <div class="form-actions">

            <button
                id="cancelInspection"
                class="secondary-btn"
                type="button">
                CANCEL
            </button>

            <button
                id="saveInspection"
                class="primary-btn"
                type="button">
                CREATE
            </button>

        </div>

    </div>

</div>


<!-- ================================
     NEW FINDING MODAL
================================ -->

<div id="findingModal" class="form-modal">

    <div class="form-sheet">

        <div class="form-title">
            Add Finding
        </div>


        <div class="form-group">

            <label class="form-label">
                Location
            </label>

            <input
                id="findingLocation"
                class="form-input"
                type="text"
                placeholder="Örn. Aft Cargo Compartment"
                autocomplete="off">

        </div>


        <div class="form-group">

            <label class="form-label">
                Finding
            </label>

            <textarea
                id="findingText"
                class="form-textarea"
                placeholder="Bulguyu yazın..."></textarea>

        </div>


        <!-- PHOTO BUTTONS -->

        <div class="form-group">

            <label class="form-label">
                Photos
            </label>

            <div class="photo-pick-row">

                <button
                    id="takePhotoBtn"
                    class="photo-pick-btn"
                    type="button">

                    📷 TAKE PHOTO

                </button>

                <button
                    id="choosePhotosBtn"
                    class="photo-pick-btn"
                    type="button">

                    🖼️ CHOOSE PHOTOS

                </button>

            </div>


            <!-- CAMERA: ONE PHOTO -->

            <input
                id="cameraInput"
                type="file"
                accept="image/*"
                capture="environment"
                hidden>


            <!-- GALLERY: MULTIPLE PHOTOS -->

            <input
                id="galleryInput"
                type="file"
                accept="image/*"
                multiple
                hidden>


            <div
                id="photoSelectionInfo"
                class="photo-selection-info">

                Henüz fotoğraf seçilmedi.

            </div>


            <div
                id="pendingGallery"
                class="pending-gallery">
            </div>

        </div>


        <div class="form-actions">

            <button
                id="cancelFinding"
                class="secondary-btn"
                type="button">

                CANCEL

            </button>

            <button
                id="saveFinding"
                class="primary-btn"
                type="button">

                SAVE FINDING

            </button>

        </div>

    </div>

</div>


<!--
================================
ADD PHOTOS TO EXISTING FINDING
================================
-->

<input
    id="addPhotosInput"
    type="file"
    accept="image/*"
    multiple
    hidden>


<!-- ================================
     PHOTO FULLSCREEN VIEWER
================================ -->

<div id="photoModal" class="photo-modal">

    <div class="photo-topbar">

        <span
            id="photoCounter"
            class="photo-counter">

            1 / 1

        </span>

        <button
            id="photoClose"
            class="photo-close"
            type="button">

            ×

        </button>

    </div>


    <div class="photo-stage">

        <img
            id="photoPreview"
            alt="Finding photo">


        <div class="photo-nav">

            <button
                id="photoPrev"
                type="button">

                ‹

            </button>

            <button
                id="photoNext"
                type="button">

                ›

            </button>

        </div>

    </div>


    <div class="photo-bottom">

        <button
            id="annotatePhoto"
            class="photo-action"
            type="button">

            ✏️ MARK

        </button>

    </div>

</div>


<!-- ================================
     PHOTO ANNOTATION
================================ -->

<div id="annotationModal" class="annotation-modal">

    <div class="annotation-header">

        <span class="annotation-title">
            PHOTO MARKING
        </span>

        <button
            id="annotationClose"
            class="annotation-close"
            type="button">

            ×

        </button>

    </div>


    <div class="annotation-stage">

        <canvas id="annotationCanvas"></canvas>

    </div>


    <div class="annotation-toolbar">

        <button
            class="tool-btn active"
            data-tool="pen"
            type="button">

            ✏️ PEN

        </button>

        <button
            class="tool-btn"
            data-tool="circle"
            type="button">

            ⭕ CIRCLE

        </button>

        <button
            class="tool-btn"
            data-tool="arrow"
            type="button">

            ➡️ ARROW

        </button>

        <button
            class="tool-btn"
            data-tool="text"
            type="button">

            🔤 TEXT

        </button>

        <button
            class="tool-btn"
            data-tool="undo"
            type="button">

            ↩️ UNDO

        </button>

        <button
            class="tool-btn tool-danger"
            data-tool="clear"
            type="button">

            🗑 CLEAR

        </button>

        <button
            class="tool-btn tool-save"
            data-tool="save"
            type="button">

            ✓ SAVE

        </button>

    </div>

</div>


<div
    id="offlineBar"
    class="offline-bar">

    OFFLINE • Local data

</div>


<script src="theme.js"></script>
<script src="inspection.js"></script>

</body>
</html>
