<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Adam/Saat</title>

    <link
        rel="stylesheet"
        href="theme.css">

    <style>

        /* =====================================================
           MAN-HOUR
           Simple / clean layout
           ===================================================== */

        .mh-page {
            width: 100%;
        }

        .mh-form {
            display: grid;
            gap: 14px;
        }

        .mh-field {
            display: grid;
            gap: 6px;
        }

        .mh-label {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.65;
        }

        .mh-input,
        .mh-select {
            width: 100%;
            box-sizing: border-box;

            height: 42px;

            padding: 0 11px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--bg);
            color: var(--text);

            font-family: inherit;
            font-size: 16px !important;

            outline: none;
        }

        .mh-input:focus,
        .mh-select:focus {
            border-color: var(--accent);
        }


        /* SHIFT INFO */

        .mh-gmt {
            display: none;

            padding-top: 2px;

            font-size: 12px;
            opacity: 0.7;
        }

        .mh-gmt.visible {
            display: block;
        }


        /* TABLE */

        .mh-table-wrap {
            display: none;

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }

        .mh-table-wrap.visible {
            display: block;
        }

        .mh-table {
            width: 100%;

            border-collapse: collapse;

            table-layout: fixed;
        }

        .mh-table th {
            padding: 8px 5px;

            border-bottom: 1px solid var(--border);

            font-size: 10px;
            font-weight: 600;

            text-align: left;

            opacity: 0.6;
        }

        .mh-table td {
            padding: 4px 3px;

            border-bottom: 1px solid var(--border);

            vertical-align: middle;
        }

        .mh-table th:first-child,
        .mh-table td:first-child {
            width: 92px;
        }

        .mh-time {
            font-size: 10px;
            font-weight: 600;

            white-space: nowrap;

            opacity: 0.8;
        }

        .mh-cell-input {
            width: 100%;
            height: 36px;

            box-sizing: border-box;

            padding: 0 7px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--bg);
            color: var(--text);

            font-family: inherit;
            font-size: 14px !important;

            outline: none;
        }

        .mh-cell-input:focus {
            border-color: var(--accent);
        }

        .mh-cell-input::placeholder {
            opacity: 0.35;
        }


        /* ACTIONS */

        .mh-actions {
            display: none;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin-top: 14px;
        }

        .mh-actions.visible {
            display: grid;
        }

        .mh-button {
            height: 40px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .mh-button:active {
            transform: scale(0.99);
        }

        .mh-button:hover {
            border-color: var(--accent);
        }

        .mh-status {
            min-height: 17px;

            margin-top: 8px;

            text-align: center;

            font-size: 11px;

            opacity: 0.6;
        }


        /* TOTAL */

        .mh-total {
            display: none;

            margin-top: 12px;

            font-size: 11px;

            opacity: 0.6;

            text-align: right;
        }

        .mh-total.visible {
            display: block;
        }


        /* MOBILE */

        @media (max-width: 380px) {

            .mh-table th:first-child,
            .mh-table td:first-child {
                width: 86px;
            }

            .mh-time {
                font-size: 9px;
            }

            .mh-cell-input {
                padding: 0 6px;
                font-size: 13px !important;
            }

        }

    </style>

</head>


<body>

<div class="page-wrap mh-page">


    <!-- HEADER -->

    <header class="page-header">

        <a
            href="index.html"
            class="back-link">
            ← Back
        </a>

        <h1 class="page-title">
            Adam/Saat
        </h1>

        <button
            id="themeBtn"
            class="theme-btn"
            type="button"
            onclick="toggleTheme()">
            🌙
        </button>

    </header>


    <!-- DATE / SHIFT -->

    <section class="card">

        <div class="mh-form">


            <!-- DATE -->

            <div class="mh-field">

                <label
                    class="mh-label"
                    for="workDate">
                    DATE
                </label>

                <input
                    id="workDate"
                    class="mh-input"
                    type="date">

            </div>


            <!-- SHIFT -->

            <div class="mh-field">

                <label
                    class="mh-label"
                    for="shiftSelect">
                    SHIFT
                </label>

                <select
                    id="shiftSelect"
                    class="mh-select">

                    <option value="">
                        Select Shift
                    </option>

                    <option value="07-15">
                        07:00 – 15:00
                    </option>

                    <option value="15-23">
                        15:00 – 23:00
                    </option>

                    <option value="23-07">
                        23:00 – 07:00
                    </option>

                </select>

            </div>


            <!-- GMT -->

            <div
                id="gmtInfo"
                class="mh-gmt">

                GMT:
                <strong id="gmtShift">
                    —
                </strong>

            </div>


        </div>

    </section>


    <!-- WORK TABLE -->

    <section
        id="tableCard"
        class="card mh-table-wrap">

        <table class="mh-table">

            <thead>

                <tr>

                    <th>
                        GMT
                    </th>

                    <th>
                        WORK ORDER
                    </th>

                    <th>
                        TASK CARD
                    </th>

                </tr>

            </thead>

            <tbody id="timeline">

                <!-- Generated by JavaScript -->

            </tbody>

        </table>


        <div
            id="totalTime"
            class="mh-total">

            Work time:
            <strong>0h 00m</strong>

        </div>


        <div
            id="actions"
            class="mh-actions">

            <button
                id="saveBtn"
                class="mh-button"
                type="button">
                SAVE
            </button>

            <button
                id="clearBtn"
                class="mh-button"
                type="button">
                CLEAR
            </button>

        </div>


        <div
            id="saveStatus"
            class="mh-status">
        </div>

    </section>


</div>


<script src="theme.js"></script>

<script src="manhour.js"></script>


</body>

</html>
