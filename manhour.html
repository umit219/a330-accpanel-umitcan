<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Adam/Saat</title>

    <link
        rel="stylesheet"
        href="theme.css">

    <style>

        /* =====================================================
           MAN-HOUR
           Simple / clean layout
           ===================================================== */

        .mh-page {
            width: 100%;
        }

        .mh-form {
            display: grid;
            gap: 14px;
        }

        .mh-field {
            display: grid;
            gap: 6px;
        }

        .mh-label {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.65;
        }

        .mh-input,
        .mh-select {
            width: 100%;
            box-sizing: border-box;

            height: 42px;

            padding: 0 11px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--bg);
            color: var(--text);

            font-family: inherit;
            font-size: 16px !important;

            outline: none;
        }

        .mh-input:focus,
        .mh-select:focus {
            border-color: var(--accent);
        }


        /* SHIFT INFO */

        .mh-gmt {
            display: none;

            padding-top: 2px;

            font-size: 12px;
            opacity: 0.7;
        }

        .mh-gmt.visible {
            display: block;
        }


        /* TABLE */

        .mh-table-wrap {
            display: none;

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }

        .mh-table-wrap.visible {
            display: block;
        }

        .mh-table {
            width: 100%;

            border-collapse: collapse;

            table-layout: fixed;
        }

        .mh-table th {
            padding: 8px 5px;

            border-bottom: 1px solid var(--border);

            font-size: 10px;
            font-weight: 600;

            text-align: left;

            opacity: 0.6;
        }

        .mh-table td {
            padding: 4px 3px;

            border-bottom: 1px solid var(--border);

            vertical-align: middle;
        }

        .mh-table th:first-child,
        .mh-table td:first-child {
            width: 92px;
        }

        .mh-time {
            font-size: 10px;
            font-weight: 600;

            white-space: nowrap;

            opacity: 0.8;
        }

        .mh-cell-input {
            width: 100%;
            height: 36px;

            box-sizing: border-box;

            padding: 0 7px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--bg);
            color: var(--text);

            font-family: inherit;
            font-size: 14px !important;

            outline: none;
        }

        .mh-cell-input:focus {
            border-color: var(--accent);
        }

        .mh-cell-input::placeholder {
            opacity: 0.35;
        }


        /* ACTIONS */

        .mh-actions {
            display: none;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin-top: 14px;
        }

        .mh-actions.visible {
            display: grid;
        }

        .mh-button {
            height: 40px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .mh-button:active {
            transform: scale(0.99);
        }

        .mh-button:hover {
            border-color: var(--accent);
        }

        .mh-status {
            min-height: 17px;

            margin-top: 8px;

            text-align: center;

            font-size: 11px;

            opacity: 0.6;
        }


        /* TOTAL */

        .mh-total {
            display: none;

            margin-top: 12px;

            font-size: 11px;

            opacity: 0.6;

            text-align: right;
        }

        .mh-total.visible {
            display: block;
        }


        /* MOBILE */

        @media (max-width: 380px) {

            .mh-table th:first-child,
            .mh-table td:first-child {
                width: 86px;
            }

            .mh-time {
                font-size: 9px;
            }

            .mh-cell-input {
                padding: 0 6px;
                font-size: 13px !important;
            }

        }

    
        /* Adam/Saat — balanced iOS layout */
        body.liquid-page { padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
        .mh-page { max-width: 560px; margin: 0 auto; }
        .mh-page .page-header {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
            align-items: center;
            gap: 8px;
            min-height: 56px;
            margin-bottom: 22px;
            padding: 8px 10px;
        }
        .mh-page .page-header .back-link { justify-self: start; font-size: 14px; }
        .mh-page .page-header .page-title { justify-self: center; text-align: center; font-size: 18px; white-space: nowrap; }
        .mh-page .page-header .theme-btn { justify-self: end; width: 40px; height: 40px; }
        .mh-page .card {
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--accent);
            border-radius: 23px;
            background: var(--glass-bg);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(24px) saturate(155%);
            -webkit-backdrop-filter: blur(24px) saturate(155%);
        }
        .mh-form { gap: 18px; }
        .mh-field { gap: 8px; }
        .mh-label { font-size: 13px; letter-spacing: .04em; }
        .mh-input, .mh-select {
            height: 54px;
            padding: 0 14px;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            background: color-mix(in srgb, var(--surface) 78%, transparent);
        }
        .mh-table-wrap { padding: 14px; }
        .mh-table { min-width: 420px; }
        .mh-table th { font-size: 11px; padding: 10px 6px; }
        .mh-table td { padding: 6px 4px; }
        .mh-cell-input { height: 40px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent); }
        .mh-button { height: 46px; border-radius: 14px; background: var(--icon-bg); }
        @media (max-width: 480px) {
            body.liquid-page { padding-left: 14px; padding-right: 14px; }
            .mh-page .page-header { gap: 5px; padding: 8px 7px; }
            .mh-page .page-header .back-link { font-size: 12px; }
            .mh-page .page-header .page-title { font-size: 17px; }
            .mh-page .card { padding: 16px; }
        }

    
        /* Final mobile layout correction: prevent date/select overflow */
        .mh-page { width: 100%; max-width: 560px; min-width: 0; }
        .mh-page .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .mh-page .page-header .back-link { flex: 0 1 auto; min-width: 0; }
        .mh-page .page-header .page-title { flex: 1 1 auto; min-width: 0; text-align: center; }
        .mh-page .card { width: 100%; min-width: 0; overflow: hidden; }
        .mh-form, .mh-field { width: 100%; min-width: 0; }
        .mh-input, .mh-select {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }
        .mh-select {
            appearance: auto;
            -webkit-appearance: menulist;
        }
        #workDate { max-width: 100%; }
        .mh-table-wrap { overflow-x: auto; }
        @media (max-width: 480px) {
            .mh-page .page-header .page-title { font-size: 16px; }
            .mh-page .page-header .back-link { font-size: 12px; }
            .mh-page .card { padding: 14px; }
        }

    
        /* Mobile layout correction: keep form fields inside the card */
        .mh-page { width: 100%; max-width: 560px; min-width: 0; margin: 0 auto; }
        .mh-page .page-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
        .mh-page .page-header .back-link { flex: 0 1 auto; min-width: 0; font-size: 13px; }
        .mh-page .page-header .page-title { flex: 1 1 auto; min-width: 0; text-align: center; font-size: 17px; }
        .mh-page .card { width: 100%; min-width: 0; overflow: hidden; }
        .mh-form, .mh-field { width: 100%; min-width: 0; }
        .mh-input, .mh-select {
            display: block; width: 100%; max-width: 100%; min-width: 0;
            box-sizing: border-box; height: 54px; border-radius: 15px;
            padding: 0 14px; border: 1px solid var(--glass-border);
            background: color-mix(in srgb, var(--surface) 78%, transparent);
        }
        #workDate { max-width: 100%; }
        .mh-table-wrap { overflow-x: auto; }
        @media (max-width: 480px) {
            body.liquid-page { padding-left: 14px; padding-right: 14px; }
            .mh-page .page-header { gap: 6px; }
            .mh-page .page-header .back-link { font-size: 12px; }
            .mh-page .page-header .page-title { font-size: 16px; }
            .mh-page .card { padding: 14px; }
        }

    
        /* Bulk-fill a time range in one action */
        .mh-range-fill {
            padding: 14px;
            margin: 0 0 14px;
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            background: color-mix(in srgb, var(--surface) 68%, transparent);
        }
        .mh-range-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
        .mh-range-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mh-range-grid .mh-field { min-width: 0; }
        .mh-range-grid .mh-label { font-size: 10px; }
        .mh-range-grid .mh-input, .mh-range-grid .mh-select { height: 46px; min-width: 0; }
        .mh-apply-range { width: 100%; margin-top: 12px; background: var(--accent); color: #fff; border-color: transparent; }
        #rangeStatus { margin-bottom: 0; }
        @media (max-width: 380px) {
            .mh-range-fill { padding: 11px; }
            .mh-range-grid { gap: 8px; }
        }

    </style>

</head>


<body class="liquid-page">

<div class="page-wrap mh-page">


    <!-- HEADER -->

    <header class="page-header">

        <a
            href="index.html"
            class="back-link">
            ← Ana Menü
        </a>

        <h1 class="page-title">
            Adam/Saat
        </h1>
</header>


    <!-- DATE / SHIFT -->

    <section class="card">

        <div class="mh-form">


            <!-- DATE -->

            <div class="mh-field">

                <label
                    class="mh-label"
                    for="workDate">
                    DATE
                </label>

                <input
                    id="workDate"
                    class="mh-input"
                    type="date">

            </div>


            <!-- SHIFT -->

            <div class="mh-field">

                <label
                    class="mh-label"
                    for="shiftSelect">
                    SHIFT
                </label>

                <select
                    id="shiftSelect"
                    class="mh-select">

                    <option value="">
                        Vardiya Seçiniz
                    </option>

                    <option value="07-15">
                        07:00 – 15:00
                    </option>

                    <option value="15-23">
                        15:00 – 23:00
                    </option>

                    <option value="23-07">
                        23:00 – 07:00
                    </option>

                </select>

            </div>


            <!-- GMT -->

            <div
                id="gmtInfo"
                class="mh-gmt">

                GMT:
                <strong id="gmtShift">
                    —
                </strong>

            </div>


        </div>

    </section>


    <!-- WORK TABLE -->

    <section
        id="tableCard"
        class="card mh-table-wrap">

        
        <div id="rangeFill" class="mh-range-fill">
            <div class="mh-range-title">İş saat aralığını doldur</div>
            <div class="mh-range-grid">
                <label class="mh-field">
                    <span class="mh-label">BAŞLANGIÇ (GMT)</span>
                    <select id="rangeStart" class="mh-select"></select>
                </label>
                <label class="mh-field">
                    <span class="mh-label">BİTİŞ (GMT)</span>
                    <select id="rangeEnd" class="mh-select"></select>
                </label>
                <label class="mh-field">
                    <span class="mh-label">WORK ORDER</span>
                    <input id="rangeWO" class="mh-input" type="text" placeholder="WO">
                </label>
                <label class="mh-field">
                    <span class="mh-label">TASK CARD</span>
                    <input id="rangeTC" class="mh-input" type="text" placeholder="TC">
                </label>
            </div>
            <button id="applyRangeBtn" class="mh-button mh-apply-range" type="button">Seçilen aralığa uygula</button>
            <div id="rangeStatus" class="mh-status" aria-live="polite"></div>
        </div>

        <table class="mh-table">

            <thead>

                <tr>

                    <th>
                        GMT
                    </th>

                    <th>
                        WORK ORDER
                    </th>

                    <th>
                        TASK CARD
                    </th>

                </tr>

            </thead>

            <tbody id="timeline">

                <!-- Generated by JavaScript -->

            </tbody>

        </table>


        <div
            id="totalTime"
            class="mh-total">

            Work time:
            <strong>0h 00m</strong>

        </div>


        <div
            id="actions"
            class="mh-actions">

            <button
                id="saveBtn"
                class="mh-button"
                type="button">
                SAVE
            </button>

            <button
                id="clearBtn"
                class="mh-button"
                type="button">
                CLEAR
            </button>

        </div>


        <div
            id="saveStatus"
            class="mh-status">
        </div>

    </section>


</div>


<script src="theme.js"></script>

<script src="manhour.js"></script>


</body>

</html>
