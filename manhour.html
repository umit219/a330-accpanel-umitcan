<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam/Saat</title>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<div class="page-wrap">

    <!-- HEADER -->
    <header class="page-header">

        <a href="index.html" class="back-link">
            ← Back
        </a>

        <h1 class="page-title">
            Adam/Saat
        </h1>

        <button id="themeToggle" class="theme-btn" type="button">
            🌙
        </button>

    </header>


    <!-- DATE / SHIFT -->
    <section class="card">

        <div class="form-group">
            <label for="workDate">Date</label>
            <input type="date" id="workDate">
        </div>

        <div class="form-group">
            <label for="shiftSelect">Shift</label>

            <select id="shiftSelect">

                <option value="07-15">
                    07:00 – 15:00
                </option>

                <option value="15-23">
                    15:00 – 23:00
                </option>

                <option value="23-07">
                    23:00 – 07:00
                </option>

            </select>
        </div>

        <div class="shift-info">

            <div>
                <span class="info-label">LOCAL</span>
                <strong id="localShift">
                    07:00 – 15:00
                </strong>
            </div>

            <div>
                <span class="info-label">GMT</span>
                <strong id="gmtShift">
                    04:00 – 12:00
                </strong>
            </div>

        </div>

    </section>


    <!-- SUMMARY -->
    <section class="card">

        <div class="summary-grid">

            <div class="summary-item">
                <span class="summary-label">
                    WORK ORDERS
                </span>

                <strong id="totalWO">
                    0
                </strong>
            </div>


            <div class="summary-item">
                <span class="summary-label">
                    TASK CARDS
                </span>

                <strong id="totalTC">
                    0
                </strong>
            </div>


            <div class="summary-item">
                <span class="summary-label">
                    WORK TIME
                </span>

                <strong id="totalTime">
                    0h 00m
                </strong>
            </div>


            <div class="summary-item">
                <span class="summary-label">
                    MAN-HOURS
                </span>

                <strong id="totalMH">
                    0.00
                </strong>
            </div>

        </div>

    </section>


    <!-- TIMELINE -->
    <section class="card">

        <div class="section-heading">

            <div>
                <h2>Shift Timeline</h2>

                <p class="section-subtitle">
                    GMT · 10 minute intervals
                </p>
            </div>

        </div>


        <div id="timeline" class="timeline">

            <!-- Generated by manhour.js -->

        </div>

    </section>


    <!-- ACTION BUTTONS -->
    <section class="card">

        <button
            id="saveBtn"
            class="btn"
            type="button">
            💾 SAVE
        </button>


        <button
            id="clearBtn"
            class="btn btn-danger"
            type="button">
            🗑 CLEAR SHIFT
        </button>


        <div
            id="saveStatus"
            class="save-status">
        </div>

    </section>


    <!-- SAVED SHIFTS -->
    <section class="card">

        <div class="section-heading">

            <div>
                <h2>Saved Shifts</h2>

                <p class="section-subtitle">
                    Stored on this device
                </p>
            </div>

        </div>


        <div id="savedShifts" class="saved-shifts">

            <!-- Generated by JS -->

        </div>

    </section>

</div>


<!-- WORK MODAL -->
<div
    id="workModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Work Entry
            </h2>

            <button
                id="closeModal"
                class="modal-close"
                type="button">
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="selected-time">

                <span>
                    GMT
                </span>

                <strong id="modalTime">
                    04:00 – 04:10
                </strong>

            </div>


            <div class="form-group">

                <label for="workOrder">
                    Work Order
                </label>

                <input
                    type="text"
                    id="workOrder"
                    placeholder="WO-12345"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label for="taskCard">
                    Task Card
                </label>

                <input
                    type="text"
                    id="taskCard"
                    placeholder="32-41-00"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label for="technicians">
                    Technicians
                </label>

                <select id="technicians">

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>

                </select>

            </div>


            <div class="form-group">

                <label for="duration">
                    Duration
                </label>

                <select id="duration">

                    <option value="10">
                        10 min
                    </option>

                    <option value="20">
                        20 min
                    </option>

                    <option value="30">
                        30 min
                    </option>

                    <option value="40">
                        40 min
                    </option>

                    <option value="50">
                        50 min
                    </option>

                    <option value="60">
                        1 hour
                    </option>

                    <option value="70">
                        1h 10m
                    </option>

                    <option value="80">
                        1h 20m
                    </option>

                    <option value="90">
                        1h 30m
                    </option>

                    <option value="120">
                        2 hours
                    </option>

                    <option value="180">
                        3 hours
                    </option>

                    <option value="240">
                        4 hours
                    </option>

                    <option value="480">
                        Entire Shift
                    </option>

                </select>

            </div>

        </div>


        <div class="modal-footer">

            <button
                id="cancelWork"
                class="btn btn-secondary"
                type="button">
                CANCEL
            </button>

            <button
                id="saveWork"
                class="btn"
                type="button">
                SAVE
            </button>

        </div>

    </div>

</div>


<script src="theme.js"></script>
<script src="manhour.js"></script>

</body>
</html>
